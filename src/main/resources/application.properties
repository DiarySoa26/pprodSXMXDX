pipeline.api.url=${PIPELINE_API_URL:https://dixa-spark.onrender.com}
# Render (offre gratuite) met ~1 min a se reveiller, et Spark peut etre long
pipeline.api.connect-timeout=${PIPELINE_CONNECT_TIMEOUT:30s}
pipeline.api.read-timeout=${PIPELINE_READ_TIMEOUT:10m}
pipeline.api.max-retries=${PIPELINE_MAX_RETRIES:3}
pipeline.api.retry-delay=${PIPELINE_RETRY_DELAY:15s}

