# SXMXDX - SPRING BOOT

spring.application.name=sxmxdx-backend

server.port=${PORT:8081}


# POSTGRESQL
# Les identifiants ne sont jamais versionnés : ils sont fournis par l'environnement.

spring.datasource.url=${DB_URL:jdbc:postgresql://ep-sparkling-hall-bducpnk7-pooler.c-8.us-east-2.aws.neon.tech/sxmxdx6?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USER:sxmxdx}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / HIBERNATE

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true


# IMPORTS

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Dossier local où le backend dépose les fichiers importés
app.import.directory=${IMPORT_DIRECTORY:./data}
# Chemin de ce même dossier vu par le pipeline Flask
pipeline.data.directory=${PIPELINE_DATA_DIRECTORY:/app/data}

pipeline.api.url=${PIPELINE_API_URL:https://dixa-spark.onrender.com}


# SÉCURITÉ

# Clé HMAC de signature des jetons JWT (au moins 32 caractères).
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:PT8H}

# Origines autorisées par CORS (séparées par des virgules)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
